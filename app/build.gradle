plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.room'
}

room {
    schemaDirectory "$projectDir/schemas"
}

android {
    namespace 'com.ae.apps.randomcontact'

    defaultConfig {
        applicationId "com.ae.apps.randomcontact"
        minSdkVersion 23
        targetSdkVersion 37
        compileSdk 37
        versionCode 140
        versionName "5.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "$app_build_name-${variant.name}-${variant.versionName}-build-${variant.versionCode}.apk"
        }
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
    }

}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }

    jvmToolchain(17)
}

dependencies {

    implementation libs.kotlin.stdlib.v240
    implementation libs.material
    implementation libs.lifecycleExt
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.preference.ktx

    def room_version = '2.8.5'
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation libs.androidx.room.ktx
    
    implementation libs.core
    implementation libs.runtime.permissions
    implementation libs.contacts.api
    implementation libs.multi.contact
    implementation libs.utilities
    implementation libs.lib.anko.async

    // Testing dependencies
    def junitVersion = '1.3.0'
    def espressoVersion = '3.7.0'

    testImplementation libs.junit
    testImplementation libs.androidx.junit
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.kotlin
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.espresso.contrib
    androidTestImplementation libs.androidx.espresso.intents
}